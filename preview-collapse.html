<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>模型分工 · 药丸折叠预览</title>
<style>
  :root{
    --dsw-alias-bg-layer-2: rgba(127,127,127,.14);
    --dsw-alias-border-l2: rgba(127,127,127,.45);
    --dsw-alias-label-secondary:#a8a8b3;
    --dsw-alias-label-primary:#e8e8ee;
    --dsw-alias-interactive-bg-hover: rgba(127,127,127,.22);
    --dsw-alias-brand-primary:#3b82f6;
    --dsw-alias-brand-text:#fff;
  }
  body{margin:0;padding:28px;background:#1b1b20;color:var(--dsw-alias-label-primary);
       font:14px/1.6 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif;}
  h1{font-size:18px;margin:0 0 4px}
  h2{font-size:14px;margin:28px 0 8px;color:var(--dsw-alias-label-secondary);font-weight:600}
  p.note{color:var(--dsw-alias-label-secondary);font-size:12px;margin:0 0 4px}
  .stage{background:#232329;border:1px solid rgba(127,127,127,.25);border-radius:12px;padding:16px 18px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  .ruler{font:11px/1 ui-monospace,monospace;color:var(--dsw-alias-label-secondary)}
  /* ---- 与插件 client.js 注入的样式保持一致 ---- */
  .mdisp-slot{display:inline-flex;align-items:center;min-width:0}
  .mdisp-slot:has(.mdisp-chip-compact){gap:6px}
  .mdisp-chip{cursor:pointer;border:1px solid var(--dsw-alias-border-l2);border-radius:999px;padding:3px 10px;font-size:12px;line-height:1.4;background:var(--dsw-alias-bg-layer-2);color:var(--dsw-alias-label-secondary)}
  .mdisp-chip:hover{background:var(--dsw-alias-interactive-bg-hover)}
  .mdisp-chip.on{background:var(--dsw-alias-brand-primary);color:var(--dsw-alias-brand-text);border-color:transparent}
  .mdisp-chip.mdisp-chip-compact{border-radius:999px;width:28px;height:28px;padding:0;display:inline-flex;align-items:center;justify-content:center;flex:none;box-sizing:border-box}
  .mdisp-chip.mdisp-chip-icon svg{width:16px;height:16px;display:block}
</style>
</head>
<body>
<h1>模型分工（Model Dispatch）— 药丸折叠预览</h1>
<p class="note">此页复刻 client.js 注入的样式，用于核对折叠态图标与配色；不参与插件运行。</p>

<h2>开启态 · 展开（文字药丸）</h2>
<div class="stage"><span class="mdisp-slot">
  <button class="mdisp-chip on" style="border-radius:999px 0 0 999px">分工 开</button>
  <button class="mdisp-chip" style="border-radius:0 999px 999px 0">便宜日常</button>
</span></div>

<h2>关闭态 · 展开（文字药丸）</h2>
<div class="stage"><span class="mdisp-slot">
  <button class="mdisp-chip" style="border-radius:999px 0 0 999px">分工 关</button>
  <button class="mdisp-chip" style="border-radius:0 999px 999px 0">便宜日常</button>
</span></div>

<h2>折叠态 · 圆形按钮（与 DSH 自带模型按钮同尺寸 28px）</h2>
<div class="stage">
  <span class="ruler">关闭：<br>圆形 28px</span>
  <span class="mdisp-slot">
    <button class="mdisp-chip mdisp-chip-compact mdisp-chip-icon" title="模型分工模式（本会话）：点击开启">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.8 8h3.6" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/><path d="M7.4 8c2 0 2.6-3.9 4.6-3.9" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/><path d="M7.4 8c2 0 2.6 3.9 4.6 3.9" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/><circle cx="2.2" cy="8" r="1.6" fill="currentColor"/><circle cx="13.4" cy="4.1" r="1.6" fill="currentColor"/><circle cx="13.4" cy="11.9" r="1.6" fill="currentColor"/></svg>
    </button>
    <button class="mdisp-chip mdisp-chip-compact mdisp-chip-icon" title="当前预设：便宜日常；点击切换到下一个预设">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 6h9.2" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/><path d="M9.8 3.4 12.6 6l-2.8 2.6" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><path d="M13 10H3.8" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/><path d="M6.2 7.4 3.4 10l2.8 2.6" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </span>
  <span class="ruler">&nbsp;&nbsp;开启：</span>
  <span class="mdisp-slot">
    <button class="mdisp-chip on mdisp-chip-compact mdisp-chip-icon" title="模型分工模式（本会话）：点击关闭">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.8 8h3.6" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/><path d="M7.4 8c2 0 2.6-3.9 4.6-3.9" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/><path d="M7.4 8c2 0 2.6 3.9 4.6 3.9" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/><circle cx="2.2" cy="8" r="1.6" fill="currentColor"/><circle cx="13.4" cy="4.1" r="1.6" fill="currentColor"/><circle cx="13.4" cy="11.9" r="1.6" fill="currentColor"/></svg>
    </button>
    <button class="mdisp-chip on mdisp-chip-compact mdisp-chip-icon" title="切换预设">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 6h9.2" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/><path d="M9.8 3.4 12.6 6l-2.8 2.6" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><path d="M13 10H3.8" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/><path d="M6.2 7.4 3.4 10l2.8 2.6" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </span>
  <span class="ruler">&nbsp;&nbsp;无预设（仅一枚）：</span>
  <span class="mdisp-slot">
    <button class="mdisp-chip mdisp-chip-compact mdisp-chip-icon" title="模型分工模式">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.8 8h3.6" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/><path d="M7.4 8c2 0 2.6-3.9 4.6-3.9" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/><path d="M7.4 8c2 0 2.6 3.9 4.6 3.9" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/><circle cx="2.2" cy="8" r="1.6" fill="currentColor"/><circle cx="13.4" cy="4.1" r="1.6" fill="currentColor"/><circle cx="13.4" cy="11.9" r="1.6" fill="currentColor"/></svg>
    </button>
  </span>
</div>

<h2>尺寸对照：折叠圆形（28px）与展开药丸</h2>
<div class="stage">
  <span class="mdisp-slot"><button class="mdisp-chip mdisp-chip-compact mdisp-chip-icon">
    <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.8 8h3.6" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/><path d="M7.4 8c2 0 2.6-3.9 4.6-3.9" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/><path d="M7.4 8c2 0 2.6 3.9 4.6 3.9" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/><circle cx="2.2" cy="8" r="1.6" fill="currentColor"/><circle cx="13.4" cy="4.1" r="1.6" fill="currentColor"/><circle cx="13.4" cy="11.9" r="1.6" fill="currentColor"/></svg>
  </button></span>
  <span class="ruler">← 圆形 28×28</span>
  <span class="mdisp-slot" style="margin-left:24px">
    <button class="mdisp-chip" style="border-radius:999px 0 0 999px">分工 关</button>
    <button class="mdisp-chip" style="border-radius:0 999px 999px 0">便宜日常</button>
  </span>
</div>
</body>
</html>
